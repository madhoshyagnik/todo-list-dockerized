# $ECR_URI = 724772048392.dkr.ecr.us-east-1.amazonaws.com
# $CHECKOUT_DIR = /home/ubuntu/actions-runner/_work/todo-list-dockerized/todo-list-dockerized
# $ECR_REPO_NAME =  image-repository
# $TAG = latest
# $REGION = ap-south-1


name: CI/CD pipeline for a TO-DO application, written in python

on:
  push:
    branches:
      - main

jobs:
  login-ecr:
    runs-on: self-hosted

    steps:

      - name: Checkout code onto the runner instance, exists temporarily in ~/actions-runner/_work/
        uses: actions/checkout@v2

      - name: Set up AWS CLI, make sure AWS CLI is installed on runner instance, with docker 
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}


      # AWS credentials will be configured automatically by the pipline, on the runner instance, just make sure docker and AWS CLI are just installed on runner instance
      - name: Build the Docker image and push it to AWS ECR, building and pushing to ECR will be done from Runner instance, as it should for CI
        run: |
          echo "Change directory to where our code is"
          cd $CHECKOUT_DIRECTORY

          echo "Login to ECR repository"
          aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_URI

          echo "Build Docker image"
          docker build -t $ECR_REPO_NAME .

          echo "Tag Docker"
          docker tag $ECR_REPO_NAME:$TAG $$ECR_URI/$$ECR_REPO_NAME:$TAG

          echo "Push Docker image to ECR"
          docker push $#ECR_URI/$#ECR_REPO_NAME:$TAG

      
