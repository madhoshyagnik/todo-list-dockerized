name: Docker CI/CD pipeline

on:
  push:
    branches:
      - main

jobs:
  login-dockerhub:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up AWS CLI
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}


      - name: CI. Build the image and push it to AWS ECR
        run: |
          echo "Change directory to where our code is. "
          cd /home/admin/actions-runner/_work/todo-list-dockerized/todo-list-dockerized
          
          echo "Login in to ECR repository"
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 724772048392.dkr.ecr.us-east-1.amazonaws.com

          echo "Build docker image"
          docker build -t image-repository .

          docker tag image-repository:latest 724772048392.dkr.ecr.us-east-1.amazonaws.com/image-repository:latest

          echo "Push the tagged image"
          docker push 724772048392.dkr.ecr.us-east-1.amazonaws.com/image-repository:latest

      
      
